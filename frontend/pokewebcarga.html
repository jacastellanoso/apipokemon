<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación Pokébola</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
    }

    /* CONTENEDOR PRINCIPAL:
       ambas Pokébolas rotan juntas exactamente en la misma posición */
    .pokeball-animation {
      position: relative;
      width: min(70vw, 368px);
      aspect-ratio: 1 / 1;
      transform-origin: 50% 50%;
      animation: pokeballSwing 0.8s ease-in-out infinite alternate;
      will-change: transform;
    }

    .pokeball-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform-origin: 50% 50%;
      will-change: opacity, filter, transform;
    }

    .pokeball-layer svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Pokébola normal */
    .pokeball-normal {
      z-index: 1;
      animation: normalFade 1.45s ease-in-out infinite;
    }

    /* Pokébola con destello */
    .pokeball-flash {
      z-index: 2;
      animation: flashFade 1.45s ease-in-out infinite;
    }

    /*
      Balanceo fluido de ambas Pokébolas juntas:
      va directamente de +26° a -26° y regresa de -26° a +26°.
      No pasa por 0° como punto de reinicio y no produce jumping.
    */
    @keyframes pokeballSwing {
      from {
        transform: rotate(26deg);
      }

      to {
        transform: rotate(-26deg);
      }
    }

      25% {
        transform: rotate(26deg);
      }

      75% {
        transform: rotate(-26deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    /*
      Fundido constante entre ambas imágenes.
      La Pokébola normal desaparece mientras la de destello aparece,
      siempre exactamente en el mismo punto y con el mismo tamaño.
    */
    @keyframes normalFade {
      0% {
        opacity: 1;
        filter: blur(0px);
      }

      25% {
        opacity: 0.72;
        filter: blur(1.5px);
      }

      50% {
        opacity: 0;
        filter: blur(6px);
      }

      75% {
        opacity: 0.72;
        filter: blur(1.5px);
      }

      100% {
        opacity: 1;
        filter: blur(0px);
      }
    }

    @keyframes flashFade {
      0% {
        opacity: 0;
        filter: blur(6px);
      }

      25% {
        opacity: 0.28;
        filter: blur(3px);
      }

      50% {
        opacity: 1;
        filter: blur(0px);
      }

      75% {
        opacity: 0.28;
        filter: blur(3px);
      }

      100% {
        opacity: 0;
        filter: blur(6px);
      }
    }

    /* Para pantallas pequeñas */
    @media (max-width: 600px) {
      .pokeball-animation {
        width: min(78vw, 300px);
      }
    }

    /* Respeta preferencias de accesibilidad */
    @media (prefers-reduced-motion: reduce) {
      .pokeball-animation,
      .pokeball-normal,
      .pokeball-flash {
        animation-play-state: paused;
      }
    }
  </style>
</head>
