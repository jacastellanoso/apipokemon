<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKEWEB G1 + Pokébola</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#173F7B;
  overflow:hidden;
  position:relative;
}


/* =========================================================
   FONDO TRIANGULAR ANIMADO
   Inspirado exactamente en la referencia:
   azul profundo + triángulos azules con cambios muy leves
   de opacidad. No interfiere con el contenido.
   ========================================================= */
.triangle-background{
  position:fixed;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  overflow:hidden;
  pointer-events:none;
  background:#173F7B;
}

.triangle-background svg{
  display:block;
  width:100%;
  height:100%;
}

.tri-a{animation:triFadeA 7.5s ease-in-out infinite alternate}
.tri-b{animation:triFadeB 9s ease-in-out infinite alternate}
.tri-c{animation:triFadeC 10.5s ease-in-out infinite alternate}
.tri-d{animation:triFadeD 8.25s ease-in-out infinite alternate}

@keyframes triFadeA{
  0%{opacity:.18}
  100%{opacity:.32}
}

@keyframes triFadeB{
  0%{opacity:.10}
  100%{opacity:.24}
}

@keyframes triFadeC{
  0%{opacity:.14}
  100%{opacity:.27}
}

@keyframes triFadeD{
  0%{opacity:.08}
  100%{opacity:.20}
}


.scene{
  position:relative;
  z-index:1;
  width:min(46vw,790px);
  max-width:790px;
  min-width:320px;
  aspect-ratio:790/650;
  background:transparent;
  overflow:visible;
}

/* =========================================================
   BLOQUE COMPLETO DE LOGOS
   ========================================================= */
.logo-group{
  position:absolute;
  inset:0;
  transform-origin:50% 50%;
  animation:shrinkGroup 1s cubic-bezier(.22,.72,.18,1) 2.25s forwards;
  view-transition-name:pokeweb-logo;
  filter:none;
}

.logo-main,
.logo-g1{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:50% 50%;
  will-change:transform,opacity;
}

.logo-main{
  z-index:2;
  width:86%;
  opacity:0;
  animation:logoPrincipal 1s cubic-bezier(.22,.72,.18,1) forwards;
  filter:
    drop-shadow(2px 0 0 #fff)
    drop-shadow(-2px 0 0 #fff)
    drop-shadow(0 2px 0 #fff)
    drop-shadow(0 -2px 0 #fff)
    drop-shadow(1.25px 1.25px 0 #fff)
    drop-shadow(-1.25px 1.25px 0 #fff)
    drop-shadow(1.25px -1.25px 0 #fff)
    drop-shadow(-1.25px -1.25px 0 #fff);
}

.logo-g1{
  z-index:1;
  width:28%;
  opacity:0;
  animation:logoG1 1.2s cubic-bezier(.22,.72,.18,1) 1s both;
  filter:
    drop-shadow(1.55px 0 0 #fff)
    drop-shadow(-1.55px 0 0 #fff)
    drop-shadow(0 1.55px 0 #fff)
    drop-shadow(0 -1.55px 0 #fff)
    drop-shadow(1px 1px 0 #fff)
    drop-shadow(-1px 1px 0 #fff)
    drop-shadow(1px -1px 0 #fff)
    drop-shadow(-1px -1px 0 #fff);
  backface-visibility:hidden;
}

.logo-main svg,
.logo-g1 svg{
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
}

.logo-main svg,
.logo-g1 svg{
  filter:none;
}

@keyframes logoPrincipal{
  0%{
    opacity:0;
    transform:translate(-50%,-42%) scale(.94);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-86%) scale(1);
  }
}

@keyframes logoG1{
  0%,4%{
    opacity:0;
    transform:translate(-50%,-42%) scale(.78);
  }
  100%{
    opacity:1;
    transform:translate(-50%,18%) scale(1);
  }
}

/* Después de terminar POKEWEB + G1,
   todo el conjunto se reduce proporcionalmente */
@keyframes shrinkGroup{
  0%{
    transform:scale(1);
  }
  100%{
    transform:scale(.62) translateY(-13%);
  }
}

/* =========================================================
   POKÉBOLA PEQUEÑA CENTRADA ABAJO
   ========================================================= */
.pokeball-wrap{
  position:absolute;
  left:50%;
  bottom:15%;
  width:54px;
  aspect-ratio:1/1;
  opacity:0;
  transform:translateX(-50%) scale(.72);
  animation:showBall 4s cubic-bezier(.22,.72,.18,1) 3.05s forwards;
}

.pokeball-animation{
  position:relative;
  width:100%;
  height:100%;
  transform-origin:50% 50%;
  animation:pokeballSwing .8s ease-in-out infinite alternate;
  will-change:transform;
}

.pokeball-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  transform-origin:50% 50%;
  will-change:opacity,filter;
}

.pokeball-layer svg{
  display:block;
  width:100%;
  height:100%;
}

.pokeball-normal{
  z-index:1;
  animation:normalFade 1.45s ease-in-out infinite;
}

.pokeball-flash{
  z-index:2;
  animation:flashFade 1.45s ease-in-out infinite;
}

@keyframes showBall{
  0%{
    opacity:0;
    transform:translateX(-50%) translateY(12px) scale(.72);
  }
  15%{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
  }
  100%{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
  }
}

@keyframes pokeballSwing{
  from{transform:rotate(26deg)}
  to{transform:rotate(-26deg)}
}

@keyframes normalFade{
  0%{opacity:1;filter:blur(0)}
  25%{opacity:.72;filter:blur(1.5px)}
  50%{opacity:0;filter:blur(6px)}
  75%{opacity:.72;filter:blur(1.5px)}
  100%{opacity:1;filter:blur(0)}
}

@keyframes flashFade{
  0%{opacity:0;filter:blur(6px)}
  25%{opacity:.28;filter:blur(3px)}
  50%{opacity:1;filter:blur(0)}
  75%{opacity:.28;filter:blur(3px)}
  100%{opacity:0;filter:blur(6px)}
}

@media(max-width:1200px){
  .scene{width:min(72vw,790px)}
}

@media(max-width:700px){
  .scene{width:min(94vw,560px);min-width:0}
  .logo-main{width:88%}
  .logo-g1{width:30%}
  .pokeball-wrap{width:46px;bottom:14%}
}

@media(max-width:480px){
  .scene{
    width:min(96vw,520px);
  }

  .triangle-background svg{
    width:140%;
    margin-left:-20%;
  }
}

@media(min-width:1600px){
  .scene{
    width:min(42vw,790px);
  }
}


.visually-hidden{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
/* =========================================================
   TRANSICION DE LA ANIMACION AL ENCABEZADO
   ========================================================= */
body{
  min-height:100vh;
  transition:background-color .8s ease;
}

body.header-ready{
  display:block;
  background:#fff;
  overflow:auto;
}

.triangle-background{
  transition:height .8s cubic-bezier(.22,.72,.18,1);
}

body.header-ready .triangle-background{
  height:120px;
  bottom:auto;
}

.site-header{
  transition:width .8s cubic-bezier(.22,.72,.18,1),
             max-width .8s cubic-bezier(.22,.72,.18,1),
             height .8s cubic-bezier(.22,.72,.18,1),
             min-height .8s cubic-bezier(.22,.72,.18,1);
}

.header-navigation{
  display:none;
}

.site-header.header-ready{
  position:fixed;
  top:0;
  left:0;
  z-index:2;
  display:grid;
  grid-template-columns:20% 80%;
  width:100%;
  max-width:none;
  min-width:0;
  height:120px;
  min-height:120px;
  aspect-ratio:auto;
  overflow:visible;
}

.site-header.header-ready .logo-group{
  /* CONTENEDOR ÚNICO DEL LOGO COMPLETO */
  position:absolute;
  inset:auto;
  left:10%;
  top:50%;
  width:clamp(145px,9vw,175px);
  min-width:0;
  height:auto;
  aspect-ratio:790/650;
  transform:translate(-50%,-50%);
  transform-origin:50% 50%;
  animation:none;
  overflow:visible;
}

/* IMPORTANTE:
   POKEWEB + G1 conservan EXACTAMENTE la misma composición
   y las mismas proporciones que tenían al finalizar la animación.
   Ya no se reposicionan ni redimensionan por separado. */
.site-header.header-ready .logo-main{
  left:50%;
  top:50%;
  width:86%;
  opacity:1;
  animation:none;
  transform:translate(-50%,-86%) scale(1);
}

.site-header.header-ready .logo-g1{
  left:50%;
  top:50%;
  width:28%;
  opacity:1;
  animation:none;
  transform:translate(-50%,18%) scale(1);
}

.site-header.header-ready .pokeball-wrap{
  display:none;
}

.site-header.header-ready .logo-group,
.site-header.header-ready .logo-main,
.site-header.header-ready .logo-g1{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* CONTORNO DEL ENCABEZADO:
   ligeramente más grueso que antes, pero conservando la proporción.
   POKEWEB y G1 mantienen ambos su contorno blanco. */
.site-header.header-ready .logo-group{
  filter:none;
}

.site-header.header-ready .logo-main{
  filter:
    drop-shadow(1.25px 0 0 #fff)
    drop-shadow(-1.25px 0 0 #fff)
    drop-shadow(0 1.25px 0 #fff)
    drop-shadow(0 -1.25px 0 #fff);
}

.site-header.header-ready .logo-g1{
  filter:
    drop-shadow(1.15px 0 0 #fff)
    drop-shadow(-1.15px 0 0 #fff)
    drop-shadow(0 1.15px 0 #fff)
    drop-shadow(0 -1.15px 0 #fff);
}

.site-header.header-ready .header-navigation{
  grid-column:2;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0 clamp(24px,4vw,64px);
}

.navigation-list{
  display:flex;
  align-items:center;
  gap:12px;
  list-style:none;
}

.navigation-link{
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  min-height:52px;
  padding:6px 20px 6px 7px;
  border:3px solid #fff;
  border-radius:999px;
  color:#fff;
  background:#24427B;
  font:700 1rem/1.2 Arial,sans-serif;
  text-decoration:none;
  transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
  overflow:hidden;
}

.navigation-icon{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff;
  color:#24427B;
  transition:background-color .22s ease,color .22s ease,transform .22s ease;
}

.navigation-icon svg{
  display:block;
  width:22px;
  height:22px;
}

.navigation-label{
  display:block;
  white-space:nowrap;
}

.navigation-link:hover{
  color:#24427B;
  background:#fff;
  border-color:#24427B;
  transform:translateY(-2px);
}

.navigation-link:hover .navigation-icon{
  background:#24427B;
  color:#fff;
  transform:scale(1.03);
}

.navigation-link:focus-visible,
.menu-toggle:focus-visible{
  outline:3px solid #FFCB05;
  outline-offset:4px;
}

.menu-toggle{
  display:none;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  border:2px solid #fff;
  border-radius:10px;
  color:#fff;
  background:rgba(8,30,59,.35);
  cursor:pointer;
}

.menu-toggle-lines,
.menu-toggle-lines::before,
.menu-toggle-lines::after{
  display:block;
  width:24px;
  height:3px;
  border-radius:2px;
  background:currentColor;
}

.menu-toggle-lines{
  position:relative;
}

.menu-toggle-lines::before,
.menu-toggle-lines::after{
  position:absolute;
  left:0;
  content:"";
}

.menu-toggle-lines::before{top:-8px}
.menu-toggle-lines::after{top:8px}

.landing-content{
  min-height:100vh;
  background:#fff;
}

body.header-ready .landing-content{
  padding-top:120px;
}

@media(max-width:700px){
  body.header-ready .triangle-background{
    height:104px;
  }

  .site-header.header-ready{
    display:flex;
    align-items:center;
    justify-content:center;
    height:104px;
    min-height:104px;
  }

  .site-header.header-ready .logo-group{
    /* En teléfono sigue siendo UN SOLO CONTENEDOR */
    position:absolute;
    inset:auto;
    left:50%;
    top:50%;
    width:clamp(125px,38vw,150px);
    min-width:0;
    height:auto;
    aspect-ratio:790/650;
    margin:0;
    transform:translate(-50%,-50%);
    transform-origin:50% 50%;
  }

  .site-header.header-ready .logo-main{
    left:50%;
    top:50%;
    width:86%;
    transform:translate(-50%,-86%) scale(1);
  }

  .site-header.header-ready .logo-g1{
    left:50%;
    top:50%;
    width:28%;
    transform:translate(-50%,18%) scale(1);
  }

  .site-header.header-ready .header-navigation{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:flex-end;
    padding:0 16px;
  }

  .menu-toggle{
    z-index:2;
    display:inline-flex;
  }

  .navigation-list{
    position:absolute;
    top:calc(100% + 8px);
    right:16px;
    display:none;
    min-width:180px;
    padding:12px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:14px;
    background:#173F7B;
    box-shadow:0 12px 30px rgba(8,30,59,.25);
  }

  .navigation-list.is-open{
    display:block;
  }

  .navigation-link{
    width:100%;
    min-height:50px;
    padding:6px 16px 6px 7px;
  }

  .navigation-icon{
    width:36px;
    height:36px;
  }

  .navigation-icon svg{
    width:21px;
    height:21px;
  }

  body.header-ready .landing-content{
    padding-top:104px;
  }
}


/* =========================================================
   MOVIMIENTO REAL DEL LOGO HACIA SU POSICIÓN EN EL HEADER
   =========================================================
   El navegador interpola la geometría completa del MISMO
   conjunto POKEWEB + G1. De esta forma no hay salto visual
   ni cambio de proporciones entre el final de la intro y
   la posición definitiva del encabezado.
   ========================================================= */
::view-transition-group(pokeweb-logo){
  animation-duration:1s;
  animation-timing-function:cubic-bezier(.22,.72,.18,1);
}

::view-transition-old(pokeweb-logo),
::view-transition-new(pokeweb-logo){
  animation-duration:1s;
  animation-timing-function:cubic-bezier(.22,.72,.18,1);
  mix-blend-mode:normal;
}

::view-transition-old(root),
::view-transition-new(root){
  animation:none;
  mix-blend-mode:normal;
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto !important;
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body>

<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;overflow:hidden">
  <defs>
    <filter id="outline-logo-main" x="-10%" y="-10%" width="120%" height="120%"
            color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.5" result="expanded"/>
      <feFlood flood-color="#fff" result="white"/>
      <feComposite in="white" in2="expanded" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outline-logo-g1" x="-10%" y="-10%" width="120%" height="120%"
            color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.25" result="expanded"/>
      <feFlood flood-color="#fff" result="white"/>
      <feComposite in="white" in2="expanded" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<div class="triangle-background" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="triPattern" width="320" height="240" patternUnits="userSpaceOnUse">
        <rect width="320" height="240" fill="#173F7B"/>

        <!-- FILA 1 -->
        <polygon class="tri-a" points="0,0 80,0 40,60" fill="#1A478C"/>
        <polygon class="tri-b" points="80,0 160,0 120,60" fill="#1A4380"/>
        <polygon class="tri-c" points="160,0 240,0 200,60" fill="#194487"/>
        <polygon class="tri-d" points="240,0 320,0 280,60" fill="#183F79"/>

        <!-- FILA 2 -->
        <polygon class="tri-b" points="0,60 40,120 80,60" fill="#184081"/>
        <polygon class="tri-c" points="80,60 120,120 160,60" fill="#1A478C"/>
        <polygon class="tri-a" points="160,60 200,120 240,60" fill="#194487"/>
        <polygon class="tri-d" points="240,60 280,120 320,60" fill="#183D79"/>

        <!-- FILA 3 -->
        <polygon class="tri-c" points="0,120 80,120 40,180" fill="#1A478C"/>
        <polygon class="tri-d" points="80,120 160,120 120,180" fill="#173F7B"/>
        <polygon class="tri-b" points="160,120 240,120 200,180" fill="#194487"/>
        <polygon class="tri-a" points="240,120 320,120 280,180" fill="#1A478C"/>

        <!-- FILA 4 -->
        <polygon class="tri-a" points="0,180 40,240 80,180" fill="#194487"/>
        <polygon class="tri-b" points="80,180 120,240 160,180" fill="#183F7B"/>
        <polygon class="tri-d" points="160,180 200,240 240,180" fill="#19427F"/>
        <polygon class="tri-c" points="240,180 280,240 320,180" fill="#1A478C"/>
      </pattern>
    </defs>

    <rect width="100%" height="100%" fill="url(#triPattern)"/>
  </svg>
</div>


<header class="scene site-header">

  <div class="logo-group" role="img" aria-label="Pok&eacute;Web G1">
    <div class="logo-main">
<svg width="100%" height="100%" viewBox="0 0 974 389" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <g transform="matrix(1,0,0,1,-3156.464426,-2699.628009)">
        <g transform="matrix(1,0,0,1,6043.32727,311.091738)">

<script>
const header = document.querySelector('.site-header');
const animatedBackground = document.querySelector('.triangle-background');
const pokeball = document.querySelector('.pokeball-wrap');
const menuToggle = document.querySelector('.menu-toggle');
const menu = document.querySelector('.navigation-list');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

const applyHeaderState = () => {
  document.body.classList.add('header-ready');
  header.classList.add('header-ready');
};

const buildHeader = () => {
  if (!header || document.body.classList.contains('header-ready')) return;

  /* Si el navegador soporta View Transitions, la geometría visual
     final del mismo logo se interpola desde su posición actual
     hasta su posición exacta dentro del encabezado. */
  if (!reducedMotion.matches && typeof document.startViewTransition === 'function') {
    document.startViewTransition(() => {
      applyHeaderState();
    });
    return;
  }

  /* Fallback: mantiene la composición correcta aunque el navegador
     no soporte todavía View Transitions. */
  applyHeaderState();
};

const closeMenu = () => {
  if (!menuToggle || !menu) return;
  menuToggle.setAttribute('aria-expanded', 'false');
  menuToggle.setAttribute('aria-label', 'Abrir men\u00fa principal');
  menu.classList.remove('is-open');
};

if (pokeball) {
  pokeball.addEventListener('animationend', (event) => {
    if (event.animationName === 'showBall') buildHeader();
  });
} else {
  buildHeader();
}

if (reducedMotion.matches) buildHeader();

if (menuToggle && menu) {
  menuToggle.addEventListener('click', () => {
    const willOpen = menuToggle.getAttribute('aria-expanded') !== 'true';
    menuToggle.setAttribute('aria-expanded', String(willOpen));
    menuToggle.setAttribute('aria-label', `${willOpen ? 'Cerrar' : 'Abrir'} men\u00fa principal`);
    menu.classList.toggle('is-open', willOpen);
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeMenu();
      menuToggle.focus();
    }
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth > 700) closeMenu();
  });
}

if (!animatedBackground) {
  console.warn('No se encontr\u00f3 el fondo animado del encabezado.');
}
</script>
