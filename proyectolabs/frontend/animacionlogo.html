<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animación Landívar Facultad</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }

  body {
    min-height: 100dvh;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100dvh;
    min-height: 100vh;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(
        circle at 50% 50%,
        #ffffff 0%,
        #ffffff 17%,
        #fbfdff 29%,
        #f5faff 48%,
        #ffffff 73%,
        #f8fcff 100%
      );
  }



  /* =========================================================
     FONDO CONCÉNTRICO CORREGIDO
     - sin rectángulos/máscaras visibles
     - aros continuos
     - relieve azul/blanco suave
     - ocupa todo el viewport
     ========================================================= */

  .background-stage {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: #ffffff;
  }

  .rings {
    position: absolute;
    left: 50%;
    top: 50%;
    width: max(145vw, 145vh);
    height: max(145vw, 145vh);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      repeating-radial-gradient(
        circle at center,
        #ffffff 0,
        #ffffff 7.4%,
        rgba(225,243,255,.92) 7.7%,
        rgba(194,228,255,.74) 10.6%,
        rgba(235,247,255,.90) 13.0%,
        #ffffff 15.2%,
        #ffffff 21.2%
      );
    filter: drop-shadow(0 0 12px rgba(0,139,255,.06));
    animation: ringsBreath 7s ease-in-out infinite;
  }

  /* Relieve interior para acercarlo a la referencia */
  .rings::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-radial-gradient(
        circle at center,
        transparent 0,
        transparent 7.0%,
        rgba(0,139,255,.07) 7.5%,
        transparent 8.4%,
        transparent 13.1%,
        rgba(255,255,255,.96) 14.2%,
        transparent 15.4%,
        transparent 21.2%
      );
    filter: blur(9px);
    opacity: .95;
  }

  /* Líneas azules muy finas, completas y discretas */
  .rings::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-radial-gradient(
        circle at center,
        transparent 0,
        transparent calc(21.2% - 1px),
        rgba(0,139,255,.43) calc(21.2% - 1px),
        rgba(0,139,255,.43) 21.2%
      );
    opacity: .58;
  }

  /* Se mantienen los elementos del HTML, pero ya no dibujan círculos extra */
  .ring,
  .outline-ring,
  .arc-mask {
    display: none !important;
  }

  .ambient-light {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(
        circle at center,
        rgba(255,255,255,.92) 0 13%,
        rgba(255,255,255,.28) 21%,
        rgba(0,139,255,.025) 36%,
        transparent 58%
      );
  }

  @keyframes ringsBreath {
    0%, 100% {
      transform: translate(-50%, -50%) scale(1);
    }
    50% {
      transform: translate(-50%, -50%) scale(1.018);
    }
  }

  /* =========================================================
     BLOQUE CENTRAL LOGO + JAGUAR
     ========================================================= */

  .animation-group {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(34vw, 330px);
    height: 330px;
    transform: translate(-50%, -50%);
    z-index: 4;
  }

  .jaguar-window {
    position: absolute;
    left: 50%;
    top: 9px;
    width: 78%;
    height: 205px;
    transform: translateX(-50%);
    overflow: hidden;
    z-index: 2;
    pointer-events: none;
  }

  .hide-mask {
    display: none;
  }

  .jaguar {
    position: absolute;
    left: 50%;
    top: 0;
    width: 100%;
    height: auto;
    opacity: 0;
    transform: translate(-50%, 105%);
    transform-origin: 50% 100%;
    will-change: transform, opacity;
    animation: jaguarMovement 10s cubic-bezier(.42,0,.24,1) forwards;
  }

  .logo {
    position: absolute;
    left: 50%;
    top: 162px;
    width: 88%;
    height: auto;
    z-index: 5;
    transform: translate(-50%, 0);
    will-change: transform;
    animation: logoMovement 10s cubic-bezier(.42,0,.24,1) forwards;
    filter: drop-shadow(0 5px 9px rgba(0,139,255,.06));
  }

  .logo svg,
  .jaguar svg {
    display: block;
    width: 100%;
    height: auto;
  }

  @keyframes logoMovement {
    0%, 20% {
      transform: translate(-50%, -78px);
    }

    34%, 76% {
      transform: translate(-50%, 0);
    }

    90%, 100% {
      transform: translate(-50%, -78px);
    }
  }

  @keyframes jaguarMovement {
    0%, 25% {
      opacity: 0;
      transform: translate(-50%, 105%) rotate(0deg);
    }

    26% {
      opacity: 1;
      transform: translate(-50%, 105%) rotate(0deg);
    }

    42% {
      opacity: 1;
      transform: translate(-50%, 0) rotate(0deg);
    }

    48% {
      opacity: 1;
      transform: translate(-50%, 0) rotate(-2deg);
    }

    55% {
      opacity: 1;
      transform: translate(-50%, 0) rotate(2deg);
    }

    62% {
      opacity: 1;
      transform: translate(-50%, 0) rotate(-2deg);
    }

    68% {
      opacity: 1;
      transform: translate(-50%, 0) rotate(0deg);
    }

    86% {
      opacity: 1;
      transform: translate(-50%, 105%) rotate(0deg);
    }

    87%, 100% {
      opacity: 0;
      transform: translate(-50%, 105%) rotate(0deg);
    }
  }

  /* =========================================================
     LOADING INFERIOR
     ========================================================= */

  .loading-indicator {
    position: absolute;
    left: 50%;
    bottom: clamp(22px, 4vh, 42px);
    width: 34px;
    height: 34px;
    transform: translateX(-50%);
    z-index: 10;
    display: grid;
    place-items: center;
    pointer-events: none;
  }

  .loading-ring {
    display: block;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    border: 3px solid rgba(0,139,255,.16);
    border-top-color: #008BFF;
    border-right-color: #008BFF;
    box-shadow: 0 0 8px rgba(0,139,255,.08);
    animation: loadingSpin .8s linear infinite;
  }

  @keyframes loadingSpin {
    to {
      transform: rotate(360deg);
    }
  }

  /* =========================================================
     RESPONSIVE
     ========================================================= */

  @media (max-width: 700px) {

    .animation-group {
      width: min(68vw, 320px);
      height: 320px;
    }

    .jaguar-window {
      width: 80%;
      height: 198px;
    }

    .logo {
      width: 90%;
      top: 157px;
    }

    .loading-indicator {
      bottom: 22px;
    }

    @keyframes logoMovement {
      0%, 20% {
        transform: translate(-50%, -70px);
      }

      34%, 76% {
        transform: translate(-50%, 0);
      }

      90%, 100% {
        transform: translate(-50%, -70px);
      }
    }
  }

  @media (max-height: 560px) and (orientation: landscape) {
    .animation-group {
      width: min(28vw, 280px);
      height: 280px;
    }

    .jaguar-window {
      height: 174px;
    }

    .logo {
      top: 138px;
    }

    .loading-indicator {
      bottom: 14px;
      transform: translateX(-50%) scale(.86);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .rings,
    .ambient-light,
    .loading-ring {
      animation: none;
    }

    .logo {
      animation: none;
      transform: translate(-50%, -78px);
    }

    .jaguar {
      animation: none;
      opacity: 0;
      transform: translate(-50%, 105%);
    }
  }
</style>
</head>

<body>
<main class="scene" aria-label="Animación Landívar Facultad">

  <!-- Fondo concéntrico -->
  <div class="background-stage" aria-hidden="true">
    <div class="rings">
      <span class="ring ring-7"></span>
      <span class="ring ring-6"></span>
      <span class="ring ring-5"></span>
      <span class="ring ring-4"></span>
      <span class="ring ring-3"></span>
      <span class="ring ring-2"></span>
      <span class="ring ring-1"></span>

      <span class="outline-ring outline-1"></span>
      <span class="outline-ring outline-2"></span>
      <span class="outline-ring outline-3"></span>

      <span class="arc-mask arc-mask-a"></span>
      <span class="arc-mask arc-mask-b"></span>
      <span class="arc-mask arc-mask-c"></span>
    </div>

    <div class="ambient-light"></div>
  </div>

  <!-- Indicador inferior -->
  <div class="loading-indicator" aria-label="Cargando">
    <span class="loading-ring"></span>
  </div>

  <!-- Logo + personaje -->
  <div class="animation-group">

    <div class="logo">
